name: C Build (x86 + x64 + driver)
on: [push, workflow_dispatch]
jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build x86
        run: |
          i686-w64-mingw32-windres -o /tmp/mf32.o sfcleaner.rc
          i686-w64-mingw32-gcc -O2 -s -Wall -Wno-pointer-sign -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -finput-charset=UTF-8 -fexec-charset=GBK -mwindows -march=i686 -Wl,--major-subsystem-version,6 -Wl,--minor-subsystem-version,1 -o SFCleaner_x86.exe sfcleaner.c /tmp/mf32.o
      - name: Build x64
        run: |
          x86_64-w64-mingw32-windres -o /tmp/mf64.o sfcleaner.rc
          x86_64-w64-mingw32-gcc -O2 -s -Wall -Wno-pointer-sign -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -finput-charset=UTF-8 -fexec-charset=GBK -mwindows -Wl,--major-subsystem-version,6 -Wl,--minor-subsystem-version,1 -o SFCleaner_x64.exe sfcleaner.c /tmp/mf64.o
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleaner-C-exe
          path: |
            SFCleaner_x86.exe
            SFCleaner_x64.exe
  driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel driver (MSVC, native subsystem)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSDIR=%%i
          if not defined VSDIR (echo [ERR] Visual Studio not found & exit /b 1)
          echo VS at %VSDIR%
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          lib.exe /def:ntoskrnl.def /out:ntoskrnl.lib /machine:x64
          cl.exe /nologo /c /GS- /Gs- /guard:cf- /sdl- /kernel /Zl /W3 sfcleaner_drv\Driver.c
          link.exe /NODEFAULTLIB /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /DRIVER /out:SFCleanerDrv.sys Driver.obj ntoskrnl.lib
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleanerDrv
          path: SFCleanerDrv.sys
