name: WinUI3 Build (embedded driver)
on: [push, workflow_dispatch]
jobs:
  driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel driver
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          lib.exe /def:ntoskrnl.def /out:ntoskrnl.lib /machine:x64
          cl.exe /nologo /c /GS- /guard:cf- /sdl- /kernel /Zl /W3 sfcleaner_drv\Driver.c
          ml64.exe /c sfcleaner_drv\chkstk.asm
          link.exe /NODEFAULTLIB /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /DRIVER /out:SFCleanerDrv.sys Driver.obj chkstk.obj ntoskrnl.lib
      - name: Sign driver
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DRIVER_PFX }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\SFCleanerCert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /v /fd sha256 /f "$env:RUNNER_TEMP\SFCleanerCert.pfx" /p sf-cleaner SFCleanerDrv.sys
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleanerDrv
          path: SFCleanerDrv.sys
  build:
    needs: [driver]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SFCleanerDrv
          path: embed-src
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('SFCleaner.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Stage embedded assets
        run: |
          copy embed-src\SFCleanerDrv.sys SFCleanerDrv.sys
      - name: Publish self-contained
        run: dotnet publish -c Release -p:Platform=x64 -p:WindowsPackageType=None -p:SelfContained=true
      - name: Stage self-contained
        shell: cmd
        run: |
          robocopy bin\x64\Release\net8.0-windows10.0.22621.0\win-x64\publish dist\self-contained /mir /njh /njs /ndl
          if %errorlevel% leq 7 (exit /b 0) else (exit /b 1)
      - name: Build MSIX
        shell: cmd
        run: build_msix_manual.bat
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleaner-WinUI3
          path: |
            dist/self-contained/**
            dist/SFCleaner.msix
  bundle:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SFCleaner-WinUI3
          path: pkg
      - name: Zip self-contained for release
        run: |
          cd pkg
          python3 -m zipfile -c SFCleaner-self-contained.zip self-contained
          rm -rf self-contained
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleaner-WinUI3-full
          path: |
            pkg/*.msix
            pkg/*.zip
  release:
    # 仅版本分支(或手动)发版; 功能分支只构建不发版 (代码取自推送提交自身)
    if: github.ref == 'refs/heads/winui3' || github.event_name == 'workflow_dispatch'
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: SFCleaner-WinUI3-full
          path: pkg
      - name: 解析版本标记与线性历史
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA8=$(git rev-parse --short=8 HEAD)
          # ---- 关联 PR (标题+正文), squash/rebase 合并后仍可取到 ----
          PR_TEXT=""
          if PRJSON=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" 2>/dev/null); then
            PR_TEXT=$(printf '%s' "$PRJSON" | python3 -c "import json,sys;d=json.load(sys.stdin);print(chr(10).join(((p.get('title') or '')+chr(10)+(p.get('body') or '')) for p in d) if isinstance(d,list) else '')" 2>/dev/null || true)
          fi
          TEXT=$(printf '%s\n%s' "$COMMIT_MSG" "$PR_TEXT")
          # ---- 版本标记 [ReleaseVer<ver>] ----
          VER=$(printf '%s' "$TEXT" | grep -oiE '\[releasever[[:space:]]*[0-9]+(\.[0-9]+){1,3}\]' | head -1 | sed -E 's/.*[Vv][Ee][Rr][[:space:]]*([0-9].*)\]/\1/' || true)
          # ---- 线性历史: push 区间无 merge; 兜底看 HEAD 是否 merge commit ----
          LINEAR=1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            [ -n "$(git rev-list --merges "$BEFORE..HEAD")" ] && LINEAR=0
          else
            [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ] && LINEAR=0
          fi
          if [ "$LINEAR" = "1" ] && [ -n "$VER" ]; then
            echo "tag=winui3-release-$VER" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"   >> "$GITHUB_OUTPUT"
            echo "title=SFCleaner-WinUI3 $VER" >> "$GITHUB_OUTPUT"
          else
            echo "tag=winui3-pre-$SHA8" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=SFCleaner-WinUI3 pre-$SHA8" >> "$GITHUB_OUTPUT"
            [ "$LINEAR" = "0" ] && echo "::warning::历史非线性(含 merge commit) — 降级为 pre-release"
          fi
      - name: 发布 (tag 已存在则跳过, 不覆盖)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRE: ${{ steps.meta.outputs.prerelease }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG 已存在 — 跳过发布 (不覆盖既有版本)"
            exit 0
          fi
          if [ "$PRE" = "true" ]; then
            gh release create "$TAG" pkg/* --prerelease --latest=false \
              --title "$TITLE" --notes "commit $GITHUB_SHA (pre-release)"
          else
            gh release create "$TAG" pkg/* --latest=false \
              --title "$TITLE" --notes "commit $GITHUB_SHA"
          fi
