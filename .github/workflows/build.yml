name: WinUI3 Build (SFCleaner)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('SFCleaner.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Publish self-contained (no -o, WinUI3 quirk)
        run: dotnet publish -c Release -p:Platform=x64 -p:WindowsPackageType=None -p:SelfContained=true
      - name: Stage self-contained
        shell: cmd
        run: |
          robocopy bin\x64\Release\net8.0-windows10.0.22621.0\win-x64\publish dist\self-contained /mir /njh /njs /ndl
          if %errorlevel% leq 7 (exit /b 0) else (exit /b 1)
      - name: Build MSIX (makeappx+signtool)
        shell: cmd
        run: build_msix_manual.bat
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleaner-WinUI3
          path: |
            dist/self-contained/**
            dist/SFCleaner.msix
