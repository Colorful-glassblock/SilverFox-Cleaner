name: WinUI3 Build (embedded driver)
on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.2.3); 留空=无标记走 pre-release'
        required: false
        default: ''
      prerelease:
        description: '强制 pre-release'
        type: boolean
        required: false
        default: false
jobs:
  driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel driver
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          lib.exe /def:ntoskrnl.def /out:ntoskrnl.lib /machine:x64
          cl.exe /nologo /c /GS- /guard:cf- /sdl- /kernel /Zl /W3 sfcleaner_drv\Driver.c
          ml64.exe /c sfcleaner_drv\chkstk.asm
          link.exe /NODEFAULTLIB /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /DRIVER /out:SFCleanerDrv.sys Driver.obj chkstk.obj ntoskrnl.lib
      - name: Sign driver
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DRIVER_PFX }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\SFCleanerCert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /v /fd sha256 /f "$env:RUNNER_TEMP\SFCleanerCert.pfx" /p sf-cleaner SFCleanerDrv.sys
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleanerDrv
          path: SFCleanerDrv.sys
  build:
    needs: [driver]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SFCleanerDrv
          path: embed-src
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('SFCleaner.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Stage embedded assets
        run: |
          copy embed-src\SFCleanerDrv.sys SFCleanerDrv.sys
      - name: 注入版本号 (命名规则 <branch>-release-<ver> / <branch>-pre-<sha8>)
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "SFC_VER=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "SFC_VER=winui3-pre-${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
          fi
      - name: Publish self-contained
        run: dotnet publish -c Release -p:Platform=x64 -p:WindowsPackageType=None -p:SelfContained=true -p:InformationalVersion=$SFC_VER
      - name: Stage self-contained
        shell: cmd
        run: |
          robocopy bin\x64\Release\net8.0-windows10.0.22621.0\win-x64\publish dist\self-contained /mir /njh /njs /ndl
          if %errorlevel% leq 7 (exit /b 0) else (exit /b 1)
      - name: Build MSIX
        shell: cmd
        run: build_msix_manual.bat
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleaner-WinUI3
          path: |
            dist/self-contained/**
            dist/SFCleaner.msix
  bundle:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SFCleaner-WinUI3
          path: pkg
      - name: Zip self-contained for release
        run: |
          cd pkg
          python3 -m zipfile -c SFCleaner-self-contained.zip self-contained
          rm -rf self-contained
      - uses: actions/upload-artifact@v4
        with:
          name: SFCleaner-WinUI3-full
          path: |
            pkg/*.msix
            pkg/*.zip
  release:
    # 仅版本分支(或手动)发版; 功能分支只构建不发版 (代码取自推送提交自身)
    if: github.ref == 'refs/heads/winui3' || github.event_name == 'workflow_dispatch'
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: SFCleaner-WinUI3-full
          path: pkg
      - name: 解析版本标记与线性历史
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          BR: winui3
          IN_VERSION: ${{ inputs.version }}
          IN_PRE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          SHA8=$(git rev-parse --short=8 HEAD)

          # ---- 1) 本次 push 区间内**全部**提交信息 (squash 后 head_commit 只含标题, 正文/多提交会丢) ----
          RANGE_MSG=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE_MSG=$(git log --format=%B "$BEFORE..HEAD" 2>/dev/null || true)
          fi
          [ -n "$RANGE_MSG" ] || RANGE_MSG="$COMMIT_MSG"

          # ---- 2) 关联 PR: 先按提交查, 再按 merge_commit_sha 反查 merged PR (squash 场景) ----
          PR_TEXT=""
          PR_TEXT=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(chr(10).join(((p.get('title') or '')+chr(10)+(p.get('body') or '')) for p in d) if isinstance(d,list) else '')" 2>/dev/null || true)
          if [ -z "$PR_TEXT" ]; then
            PR_TEXT=$(gh pr list --repo "$REPO" --base "$BR" --state merged --limit 20 \
              --json title,body,mergeCommit 2>/dev/null \
              | python3 -c "import json,sys;sha=sys.argv[1];d=json.load(sys.stdin);print(chr(10).join(((p.get('title') or '')+chr(10)+(p.get('body') or '')) for p in d if ((p.get('mergeCommit') or {}).get('oid') or '')==sha))" "$GITHUB_SHA" 2>/dev/null || true)
          fi
          [ -n "$PR_TEXT" ] && echo "::notice::已取到关联 PR 文本 (${#PR_TEXT} 字符)"

          TEXT=$(printf '%s\n%s' "$RANGE_MSG" "$PR_TEXT")

          # ---- 3) 版本标记: dispatch 输入 > [ReleaseVer<ver>]
          #   先剥掉围栏代码块/行内代码/缩进代码块再找标记 —— 说明与示例里的
          #   [ReleaseVer x.y.z] 不应触发正式发布 (v1 事故: 文档里的示例把 CI 修复发成了正式 release)
          VER=""
          if [ -n "${IN_VERSION:-}" ]; then
            VER="$IN_VERSION"
          else
            VER=$(printf '%s' "$TEXT" | python3 -c 'import re,sys;t=sys.stdin.read();t=re.sub(r"(?s)```.*?```"," ",t);t=re.sub(r"`[^`\n]*`"," ",t);t=re.sub(r"(?m)^\s{4,}.*$"," ",t);m=re.search(r"\[releasever\s*([0-9]+(?:\.[0-9]+){1,3})\]",t,re.I);print(m.group(1) if m else "")' || true)
          fi

          # ---- 4) 线性历史 ----
          LINEAR=1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            [ -n "$(git rev-list --merges "$BEFORE..HEAD")" ] && LINEAR=0
          else
            [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ] && LINEAR=0
          fi

          # ---- 5) 结论 ----
          FORCE_PRE="${IN_PRE:-false}"
          if [ "$LINEAR" = "1" ] && [ -n "$VER" ] && [ "$FORCE_PRE" != "true" ]; then
            echo "tag=$BR-release-$VER" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"      >> "$GITHUB_OUTPUT"
            echo "title=SFCleaner-WinUI3 $VER" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$BR-pre-$SHA8" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"   >> "$GITHUB_OUTPUT"
            echo "title=SFCleaner-WinUI3 pre-$SHA8" >> "$GITHUB_OUTPUT"
            if [ "$LINEAR" = "0" ]; then
              echo "::warning::历史非线性(含 merge commit) — 降级为 pre-release"
            fi
          fi
          # 兜底: 本步只产出 outputs, 分支末行不得毒化 step 退出码 (非 release push 曾因此必红)
          :
      - name: 发布 (tag 已存在则跳过, 不覆盖)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRE: ${{ steps.meta.outputs.prerelease }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG 已存在 — 跳过发布 (不覆盖既有版本)"
            exit 0
          fi
          if [ "$PRE" = "true" ]; then
            gh release create "$TAG" pkg/* --prerelease --latest=false \
              --title "$TITLE" --notes "commit $GITHUB_SHA (pre-release)"
          else
            gh release create "$TAG" pkg/* --latest=false \
              --title "$TITLE" --notes "commit $GITHUB_SHA"
          fi
